# CI do ReTool: roda em todo pull request e em todo push na main.
# Só usa emuladores do Firebase (projeto demo-retool): nenhum segredo,
# nenhum acesso ao banco real e nenhum deploy (o deploy continua manual).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: retool

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retool/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  regras:
    name: regras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retool/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache dos emuladores do Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-${{ hashFiles('retool/package-lock.json') }}
      - run: npm ci
      - name: Regras do Firestore (emulador)
        run: npm run test:rules

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retool/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache dos emuladores do Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-${{ hashFiles('retool/package-lock.json') }}
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador (emuladores)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            retool/playwright-report
            retool/test-results
          retention-days: 7
